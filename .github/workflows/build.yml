name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generar modelos, texturas y recursos
        run: |
          pip install pillow
          python3 tools/generate.py
          python3 tools/gen_assets.py
          python3 tools/gen_worldgen.py || echo "worldgen omitido"
          python3 tools/gen_sounds.py || echo "sonidos omitidos"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: emberwyrms-jar
          path: build/libs/*.jar
